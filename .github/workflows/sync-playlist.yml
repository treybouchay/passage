name: Sync Spotify playlist

on:
  schedule:
    # Daily 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Check Spotify secrets
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          missing=
          [ -z "$SPOTIFY_CLIENT_ID" ] && missing="${missing} SPOTIFY_CLIENT_ID"
          [ -z "$SPOTIFY_CLIENT_SECRET" ] && missing="${missing} SPOTIFY_CLIENT_SECRET"
          [ -z "$SPOTIFY_REFRESH_TOKEN" ] && missing="${missing} SPOTIFY_REFRESH_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty GitHub Actions secrets:$missing"
            echo "Repo → Settings → Secrets and variables → Actions"
            echo "Add SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET, and SPOTIFY_REFRESH_TOKEN"
            echo "(refresh token: npm run sync:playlist:auth --prefix server locally)."
            exit 1
          fi
          echo "Spotify secrets are present."

      - name: Sync playlist catalog
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID }}
        run: npm run sync:playlist
        working-directory: server

      - name: Commit and push if catalog changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/playlistSongs.json
          if git diff --staged --quiet; then
            echo "No playlist catalog changes."
          else
            git commit -m "chore: sync Spotify playlist catalog"
            git push
          fi
