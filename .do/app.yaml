# DigitalOcean App Platform — Passage (mypassage.io)
# Import: DO Control Panel → Apps → Create → GitHub → passage → Edit spec → paste / upload
# Or: doctl apps create --spec .do/app.yaml

name: passage
region: tor1

domains:
  - domain: mypassage.io
    type: PRIMARY
  - domain: www.mypassage.io
    type: ALIAS

# One domain: static app at /, API at /api (no separate api subdomain needed).
ingress:
  rules:
    - component:
        name: api
      match:
        path:
          prefix: /api
    - component:
        name: web
      match:
        path:
          prefix: /

static_sites:
  - name: web
    github:
      repo: treybouchay/passage
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    output_dir: dist
    catchall_document: index.html
    envs:
      - key: VITE_API_URL
        value: ""

services:
  - name: api
    github:
      repo: treybouchay/passage
      branch: main
      deploy_on_push: true
    source_dir: /server
    build_command: npm ci && npm run build
    run_command: npm start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 3001
    health_check:
      http_path: /api/health
    envs:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://mypassage.io
      - key: DATA_DIR
        value: /data
    mounts:
      - path: /data
        volume: passage-data

volumes:
  - name: passage-data
    region: tor1
    size_gigabytes: 1
